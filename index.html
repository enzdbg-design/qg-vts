<script>
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);document.body.style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`}addEventListener('resize',fit);fit();

(async()=>{await Promise.all(['16px Anton','16px Bebas','bold 13px Mont','8px Silk','8px SilkB'].map(x=>document.fonts.load(x)));
const NIGHT=location.hash==='#nuit';
const W=800,H=490,S=1;
const lo=document.getElementById('lo'),lg=lo.getContext('2d');
const img=lg.createImageData(W,H),d32=new Uint32Array(img.data.buffer);
const SCN=new Uint8Array(W*H),EM=new Uint8Array(W*H);
let EMIT=0;
// ---------- couleurs ----------
const CC={};
function rgbOf(hex){if(CC[hex])return CC[hex];const n=parseInt(hex.slice(1),16);return CC[hex]=[n>>16,n>>8&255,n&255]}
function sh(hex,f){const[r,g,b]=rgbOf(hex);const m=v=>Math.max(0,Math.min(255,Math.round(f>1?v+(255-v)*(f-1):v*f)));return'#'+((1<<24)|(m(r)<<16)|(m(g)<<8)|m(b)).toString(16).slice(1)}
function put(x,y,hex,a=1,scene=1){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;const[r,g,b]=rgbOf(hex);
  if(a<1){const o=d32[i];const or=o&255,og=o>>8&255,ob=o>>16&255;d32[i]=(255<<24)|((ob+(b-ob)*a)<<16)|((og+(g-og)*a)<<8)|(or+(r-or)*a)}
  else d32[i]=(255<<24)|(b<<16)|(g<<8)|r;
  if(scene)SCN[i]=1;EM[i]=EMIT;}
function fillPoly(pts,c,a=1){const p=pts.map(([x,y])=>[Math.round(x),Math.round(y)]);
  const y0=Math.max(0,Math.min(...p.map(q=>q[1]))),y1=Math.min(H-1,Math.max(...p.map(q=>q[1])));
  for(let y=y0;y<=y1;y++){const yc=y+.5,xs=[];
    for(let i=0;i<p.length;i++){const[ax,ay]=p[i],[bx,by]=p[(i+1)%p.length];if((ay<=yc&&by>yc)||(by<=yc&&ay>yc))xs.push(ax+(yc-ay)*(bx-ax)/(by-ay))}
    xs.sort((a,b)=>a-b);for(let k=0;k+1<xs.length;k+=2){const xa=Math.ceil(xs[k]-.5),xb=Math.ceil(xs[k+1]-.5)-1;for(let x=xa;x<=xb;x++)put(x,y,c,a)}}}
function line(a,b,c,al=1){let[x0,y0]=a.map(Math.round),[x1,y1]=b.map(Math.round);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){put(x0,y0,c,al);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function rect(x,y,w,h,c,a=1){for(let j=0;j<h;j++)for(let i=0;i<w;i++)put(x+i,y+j,c,a)}
// ---------- iso ----------
const TW=24,TH=12,ZH=14,OX=328,OY=82;
const P=(x,y,z=0)=>[OX+(x-y)*TW/2,OY+(x+y)*TH/2-z*ZH];
const quadX=(x,y,z,w,h)=>[P(x,y,z),P(x+w,y,z),P(x+w,y,z+h),P(x,y,z+h)];
const quadY=(x,y,z,d,h)=>[P(x,y,z),P(x,y+d,z),P(x,y+d,z+h),P(x,y,z+h)];
const flat=(x,y,w,d,z=0)=>[P(x,y,z),P(x+w,y,z),P(x+w,y+d,z),P(x,y+d,z)];
const OL='#141a2e';
function box(x,y,z,w,d,h,col,o={}){
  const top=o.top||col,left=o.left||sh(col,.82),right=o.right||sh(col,.64);
  fillPoly(quadX(x,y+d,z,w,h),left);fillPoly(quadY(x+w,y,z,d,h),right);fillPoly(flat(x,y,w,d,z+h),top);
  if(o.ol===false)return;
  const ol=o.ol||OL;
  // arêtes claires
  if(h>.06){line(P(x,y+d,z+h),P(x+w,y+d,z+h),sh(top,1.18));line(P(x+w,y,z+h),P(x+w,y+d,z+h),sh(top,1.1));line(P(x+w,y+d,z),P(x+w,y+d,z+h),sh(left,.8))}
  const hx=[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y,z),P(x+w,y+d,z),P(x,y+d,z),P(x,y+d,z+h)];
  for(let i=0;i<6;i++)line(hx[i],hx[(i+1)%6],ol);
}

const MONO=(t,bg)=>`<span class="mono" style="background:${bg};width:100%;height:100%;border-radius:9px;display:grid;place-items:center">${t}</span>`;
const TOOLS=[['Claude','https://claude.ai','Le cerveau des agents : il rédige, découpe les missions et répond.'],['Bulletin','https://claude.ai/artifact/CzcRGvsPMh9eSrui25NGzR','Ton bulletin d\'inscription au Track Day : pilotes inscrits, virements, décharges.'],['Drive','https://drive.google.com','Les rushs, photos et exports de chaque sortie, rangés par date.'],['Gmail','https://mail.google.com','Confirmations aux pilotes, factures et échanges avec le circuit.'],['Notion','https://www.notion.so','Les plans, les comptes rendus de réunion et le planning des événements.'],['Canva','https://www.canva.com','Affiches, visuels des posts et kakémonos aux couleurs VTS.'],['CapCut','https://www.capcut.com','Le montage des reels et des shorts.'],['ElevenLabs','https://elevenlabs.io','Les voix off et les effets sonores des vidéos.'],['Instagram','https://www.instagram.com','Posts, stories et réponses aux messages des pilotes.'],['TikTok','https://www.tiktok.com','Les vidéos courtes et les tendances.'],['YouTube','https://studio.youtube.com','Les vidéos longues et les shorts.'],['Metricool','https://app.metricool.com','La programmation des posts et les statistiques des réseaux.'],['WhatsApp','https://web.whatsapp.com','Le groupe des pilotes, les partenaires et le circuit.'],['Vercel','https://vercel.com','L\'hébergement de ce QG et du bulletin.'],['GitHub','https://github.com/enzdbg-design/qg-vts','Le code du QG.']];
const APPS=TOOLS.map(([n,url,job])=>[n,PEOPLE.filter(p=>p.tools.includes(n)).map(p=>p.n),url,job]);
const logoOf=n=>n==='Bulletin'?'<img src="logo-blanc.png">':n==='CapCut'?MONO('Cc','#111'):n==='Metricool'?MONO('M','#3d5afe'):LOGO[n];
const ap=document.getElementById('apps');ap.innerHTML=APPS.map(([n])=>`<div class="app" data-n="${n}"><div class="ic${n==='Bulletin'?' vts':''}">${logoOf(n)}</div><b>${n}</b><small>veille</small></div>`).join('');
const jr=document.getElementById('jr');let lastA=-1;
const hh=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function pushEv(html){html=html.replace(/<b>([^<]+)<\/b>/g,(m,n)=>{const q=typeof PEOPLE!=='undefined'&&byName(n);return q?`<b class="lk" data-id="${q.id}">${n}</b>`:m});const d=document.createElement('div');d.className='ev';d.innerHTML=`<time>${hh()}</time>${html}`;jr.prepend(d);while(jr.children.length>3)jr.lastChild.remove()}
pushEv('<b>Emma</b> reçoit le bulletin n°18 et le virement de 90 €');pushEv('<b>Julie</b> présente le plan de com J-30');
function tickHUD(t){const s=Math.floor(t/2.5);if(s!==lastA){lastA=s;[...ap.children].forEach((el,k)=>{const on=((k*7+s*3)%10)<5||k===0;el.classList.toggle('on',on);const L=APPS[k][1];const who=L.length?L[(s+k)%L.length]:'';el.querySelector('small').textContent=on&&who?who:'veille'})}
  document.getElementById('nb').textContent=PEOPLE.filter(p=>!p.o.place&&!(p.a.route&&(p.a.seg!==0||p.a.moving))).length}
const tp=document.getElementById('tp');let TSEL=-1;
function toolState(k){const el=ap.children[k];return{on:el.classList.contains('on'),who:el.querySelector('small').textContent}}
function setTS(k){const st=toolState(k),se=document.getElementById('tps');se.textContent=st.on?'● En cours · '+st.who:'En veille';se.classList.toggle('on',st.on)}
function showTool(k){TSEL=k;const[n,who,url,job]=APPS[k];[...ap.children].forEach((e,q)=>e.classList.toggle('sel',q===k));
  const L=document.getElementById('tpl');L.innerHTML=logoOf(n);L.className='lg'+(n==='Bulletin'?' vts':'');document.getElementById('tpn').textContent=n;document.getElementById('tpj').textContent=job;setTS(k);
  document.getElementById('tpw').innerHTML=who.map(w=>{const p=byName(w);return`<button data-w="${w}" style="background:${p.z.c}">${w}</button>`}).join('');
  const o=document.getElementById('tpo');o.href=url;o.textContent='Ouvrir '+n+' ↗';
  const r=ap.children[k].getBoundingClientRect(),b=document.body.getBoundingClientRect(),z=b.width/1920;tp.style.left=Math.min(1600,Math.max(20,(r.left-b.left)/z+28-150))+'px';tp.classList.add('show')}
function closeTool(){tp.classList.remove('show');TSEL=-1;[...ap.children].forEach(e=>e.classList.remove('sel'))}
ap.addEventListener('click',e=>{const el=e.target.closest('.app');if(!el)return;const k=[...ap.children].indexOf(el);if(k===TSEL&&tp.classList.contains('show')){closeTool();return}showTool(k)});
document.getElementById('tpx').onclick=closeTool;
document.getElementById('tpw').addEventListener('click',e=>{const w=e.target.dataset.w;if(!w)return;closeTool();openFiche(byName(w),1)});
setInterval(()=>{if(TSEL>=0&&tp.classList.contains('show'))setTS(TSEL)},500);

function drawAv(cv,p,full){const cx=cv.getContext('2d'),w=cv.width,h=cv.height,id=cx.createImageData(w,h),u=new Uint32Array(id.data.buffer);const st=p.o;const pp=pal(p.z.c,p.i,st);if(st.style==='casq')pp.B=sh(st.capc||p.z.c,.55);
  const rows=HEAD[st.style||'court'].concat(full?BODY_STAND.slice(0,13):UP.slice(0,5));rows.forEach((r,j)=>{if(j>=h)return;for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.'||!pp[ch])continue;const[R,G,B]=rgbOf(pp[ch]);u[j*w+i+1]=(255<<24)|(B<<16)|(G<<8)|R}});cx.putImageData(id,0,0);cv.style.background=sh(p.z.c,1.75)}
function drawIc(cv,ic,col){const cx=cv.getContext('2d');cx.clearRect(0,0,7,7);cx.fillStyle=col;(ICON[ic]||ICX[ic]).forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]==='W')cx.fillRect(i,j,1,1)})}
function statusOf(p){const a=p.a;if(a.hidden)return['mv','En pause'];if(a.moving)return['mv','En déplacement · '+(a.tag||'')];if(a.route&&a.seg!==0)return['mv',a.tag||'En pause'];
  if(p.o.place==='meet')return['rv','En réunion · '+cur(p)];if(p.o.place==='booth')return['rv','En visio · '+cur(p)];return['','Au poste · '+cur(p)]}

function openPole(id){if(!PO[id]){focusZone(id);return}FMODE='p';PSEL=id;SEL=null;const z=ZB[id],ch=chefOf(id),M=memOf(id),h4=fiche.querySelectorAll('h4');head(ch,z.c,z.ic,'Pôle');
  $('fn').textContent=z.n;$('fr').textContent=`${M.length} agents · chef : ${ch.n}`;drawAv($('fav'),ch,1);
  const rep=byName(ch.rep);$('fm').innerHTML=`<span>Le pôle rend compte à ${rep?`<a data-id="${rep.id}">${rep.n}</a>`:'<b>Enzo (toi)</b>'}</span>`;
  h4[0].textContent='SON RÔLE AU QG';$('fj').textContent=PJOB[id];h4[1].textContent='COMPÉTENCES DU PÔLE';$('fc').innerHTML=chips([...new Set(M.flatMap(m=>m.comp))].slice(0,8));
  h4[2].textContent='OUTILS CONNECTÉS';$('fo').innerHTML=chips([...new Set(M.flatMap(m=>m.tools))],toolChip);h4[3].textContent='EN CE MOMENT';
  h4[4].textContent='L\'ÉQUIPE';team(M);$('fm1').textContent='Confier une mission à '+ch.n;$('fm2').textContent='Voir sur le plan';updStatus();fiche.classList.add('show');fiche.scrollTop=0;focusZone(id)}
function updStatus(){if(!fiche.classList.contains('show'))return;if(FMODE==='a'){const[k,t]=statusOf(SEL);const s=$('fs');s.className='pill '+k;s.textContent='● '+t}
  else{const M=memOf(PSEL);const at=M.filter(m=>statusOf(m)[0]==='').length;const s=$('fs');s.className='pill';s.textContent=`● ${at}/${M.length} au poste · ${M.length-at} ailleurs (réunion, visio, déplacement)`;
    $('ft').innerHTML=M.map(m=>`<li><b>${m.n}</b> · ${statusOf(m)[1]}</li>`).join('')}}
setInterval(updStatus,1000);
$('fx').onclick=()=>{fiche.classList.remove('show');SEL=null;FMODE=null};
// ---------- panneau liste : équipe / cerveau ----------
const liste=$('liste'),lc=$('lc');
function closeAll(){fiche.classList.remove('show');liste.classList.remove('show');SEL=null;FMODE=null}
$('lx').onclick=()=>liste.classList.remove('show');
new MutationObserver(()=>{if(fiche.classList.contains('show'))liste.classList.remove('show')}).observe(fiche,{attributes:true,attributeFilter:['class']});
function showListe(html){fiche.classList.remove('show');SEL=null;FMODE=null;lc.innerHTML=html;liste.classList.add('show');liste.scrollTop=0;
  lc.querySelectorAll('canvas[data-id]').forEach(cv=>drawAv(cv,PB[cv.dataset.id],0))}
function openTeam(){const grp=Object.keys(PO).map(id=>{const M=memOf(id).sort((a,b)=>b.ch-a.ch);
  return `<h4 data-z="${id}" style="color:${PO[id].c}"><i style="background:${PO[id].c}"></i>${PO[id].n.toUpperCase()} · ${M.length}</h4>`+M.map(m=>{const[k,t]=statusOf(m);return `<button class="row" data-id="${m.id}"><canvas width="14" height="14" data-id="${m.id}"></canvas><span>${m.ch?'★ ':''}<b>${m.n}</b><small>${m.role}</small></span><span class="dot ${k}">● ${t.split(' · ')[0]}</span></button>`}).join('')}).join('');
  showListe(`<h2>L'équipe</h2><div class="sub">32 agents · 9 pôles · clique sur un agent pour sa fiche, sur un pôle pour y aller</div>${grp}`)}
function openBrain(){showListe(`<h2>Cerveau VTS</h2><div class="sub">La mémoire commune, lue par les 32 agents</div>
  <p>Avant chaque tâche, un agent y lit ce qui fait VTS ; après, il y range ce qu'il a produit. C'est ce qui garde le ton et les visuels cohérents d'un pôle à l'autre.</p>
  <h4 style="color:#8a93ab;cursor:default">CE QU'IL CONTIENT · OUVRE LA SOURCE</h4>
  <div class="cards"><a href="https://drive.google.com" target="_blank" rel="noopener"><b>Rushs & photos ↗</b>Classés par sortie, sur Drive</a><a href="https://claude.ai/artifact/CzcRGvsPMh9eSrui25NGzR" target="_blank" rel="noopener"><b>Inscrits ↗</b>Bulletins, virements, décharges</a><a href="https://www.notion.so" target="_blank" rel="noopener"><b>Calendrier ↗</b>Track Day 3/10/2027, mai 2027 à confirmer</a><a href="https://www.canva.com" target="_blank" rel="noopener"><b>Charte VTS ↗</b>Logo, couleurs, polices, affiches</a></div>
  <h4 style="color:#8a93ab;cursor:default">QUI L'ENRICHIT LE PLUS</h4>`+['ines','tom','emma','lea'].map(id=>{const m=PB[id];return `<button class="row" data-id="${id}"><canvas width="14" height="14" data-id="${id}"></canvas><span><b>${m.n}</b><small>${m.role}</small></span></button>`}).join(''));focusArt(...P(17.3,8.9,.5),3)}
lc.addEventListener('click',e=>{const r=e.target.closest('[data-id]');if(r&&r.tagName!=='CANVAS'){openFiche(PB[r.dataset.id],1);return}if(r){openFiche(PB[r.dataset.id],1);return}const h=e.target.closest('h4[data-z]');if(h)openPole(h.dataset.z)});
$('nvue').onclick=$('home').onclick=()=>{closeAll();closeTool();CT.z=2;clampT()};
$('nteam').onclick=openTeam;$('nb').parentElement.querySelector('i').style.cursor='pointer';[$('nb'),$('nb').nextSibling].forEach(()=>{});$('nb').style.cursor='pointer';$('nb').title='Voir qui est au poste';$('nb').onclick=openTeam;$('nbrain').onclick=openBrain;
$('jr').addEventListener('click',e=>{const b=e.target.closest('b.lk');if(b)openFiche(PB[b.dataset.id],1)});
document.querySelector('.mission .av').onclick=()=>openFiche(PB.victor,1);
$('fm').addEventListener('click',e=>{const id=e.target.dataset.id;if(id)openFiche(PB[id],1)});
$('fe').addEventListener('click',e=>{const b=e.target.closest('button');if(b)openFiche(PB[b.dataset.id],1)});
const mi=$('mi');
$('fm1').onclick=()=>{const p=FMODE==='a'?SEL:chefOf(PSEL);mi.value=`@${p.n} `;mi.focus()};
$('fm2').onclick=()=>{if(FMODE==='a')openPole(SEL.p);else focusZone(PSEL)};
$('go').onclick=()=>{const v=mi.value.trim();if(!v)return;const m=v.match(/^@(\S+)\s*(.*)$/);const to=m&&byName(m[1])?byName(m[1]):PB.victor;const txt=m&&byName(m[1])?m[2]:v;
  pushEv(`<b>Toi</b> → <b>${to.n}</b> : ${txt||'nouvelle mission'}`);OVR={t:to===PB.victor?'Mission reçue : '+(txt.length>34?txt.slice(0,34)+'…':txt):'Confie la mission à '+to.n,t0:T};mi.value=''};
mi.addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
// recherche d'agent
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
$('q').addEventListener('input',e=>{const v=norm(e.target.value.trim());if(v.length<2)return;const L=PEOPLE.filter(p=>norm(p.n).startsWith(v)||norm(p.role).includes(v));if(L.length===1)openFiche(L[0],1)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=norm(e.target.value.trim());const p=PEOPLE.find(p=>norm(p.n).startsWith(v)||norm(p.role).includes(v));if(p)openFiche(p,1)}});
// plan du bureau
const PG=[...Z.filter(z=>PO[z.id]).map(z=>[z.id,z.n.split(' ')[0].replace('Opérations','Opé.'),z.c,memOf(z.id).length]),['br','Réunion','#0fa3a3',3]];
$('pg').innerHTML=PG.map(([id,n,c,k])=>`<div data-id="${id}" style="background:${c}">${n}<b>${k}</b></div>`).join('');
$('pg').addEventListener('click',e=>{const d=e.target.closest('[data-id]');if(d)openPole(d.dataset.id)});
// ---------- interactions sur la carte ----------
const toBody=ev=>{const k=Math.min(innerWidth/1920,innerHeight/1080),ox=(innerWidth-1920*k)/2,oy=(innerHeight-1080*k)/2;return[(ev.clientX-ox)/k,(ev.clientY-oy)/k,k]};
function pick(ev){const[X,Y]=toBody(ev);const zz=CAM.z;let best=null,bd=1e9;for(const p of PEOPLE){const r=p.r;if(r.hy==null||p.a.hidden)continue;const[hx,hy]=U(r.hx,r.hy);
  if(X>hx-8*zz&&X<hx+8*zz&&Y>hy-2*zz&&Y<hy+22*zz){const d=Math.abs(X-hx)+Math.abs(Y-(hy+10*zz));if(d<bd){bd=d;best=p}}}return best}
function pickLabel(ev){const[X,Y]=toBody(ev);const l=LR.find(r=>X>r.x&&X<r.x+r.w&&Y>r.y&&Y<r.y+r.h);return l&&l.id}
let drag=null;
c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:CT.x,cy:CT.y,m:false};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(drag){const k=toBody(e)[2];const dx=(e.clientX-drag.x)/k,dy=(e.clientY-drag.y)/k;if(Math.abs(dx)+Math.abs(dy)>6)drag.m=true;
  if(drag.m){CT.x=drag.cx+dx;CT.y=drag.cy+dy;clampT();CAM.x=CT.x;CAM.y=CT.y;c.classList.add('drag')}}else{HOV=pick(e);c.style.cursor=HOV||pickLabel(e)?'pointer':''}});
c.addEventListener('pointerup',e=>{if(drag&&!drag.m){const p=pick(e);if(p)openFiche(p);else{const l=pickLabel(e);if(l==='brain'){openBrain()}else if(l)openPole(l)}}drag=null;c.classList.remove('drag')});
c.addEventListener('wheel',e=>{e.preventDefault();const[X,Y]=toBody(e);zoomTo(CT.z+(e.deltaY<0?1:-1),X,Y)},{passive:false});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='+'||e.key==='=')zoomTo(CT.z+1);if(e.key==='-')zoomTo(CT.z-1);if(e.key==='Escape'){closeAll();closeTool()}});
let last=performance.now();
function loop(now){const dt=Math.max(0,Math.min(.1,(now-last)/1000));last=now;T+=dt;FR++;if(OVR&&T-OVR.t0>7)OVR=null;step(dt);frame();stepCam();tickRelay();drawUI();tickHUD(T);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
